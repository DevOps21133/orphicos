# OrphicOS brain â€” production stack: the brain app + Caddy (automatic Let's Encrypt TLS).
#
# On the VPS:
#   1) copy server/ to the host (never client/)
#   2) create server/.env  (LLM_API_KEY, LLM_MODEL, LLM_BASE_URL â€” chmod 600)
#   3) DOMAIN=brain.orphicos.app docker compose up -d --build
#   4) issue a token:  docker compose exec brain python -m server.auth issue <user_id>
#
# Zero-retention (Rule 4): neither service logs request bodies â€” the brain never logs
# screen data by design, and Caddy's default access log is off (no `log` directive).

services:
  brain:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - brain_data:/srv/data          # tokens.json survives redeploys
    expose:
      - "8000"                        # internal network only; Caddy is the sole entry

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"                       # ACME http challenge + redirect to https
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN, e.g. DOMAIN=brain.orphicos.app docker compose up}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data              # certificates persist across restarts
      - caddy_config:/config

volumes:
  brain_data:
  caddy_data:
  caddy_config:
