# OrphicOS agent configuration (this file lives in the gitignored engine dir;
# canonical copy: orphicos/config/agents.yaml — edit there, deploy via run_task.ps1)
#
# Brain: LOCAL model server (OpenAI-compatible endpoint), fully local, no cloud APIs.
# ${VAR} placeholders are expanded from environment variables by the engine's
# config loader; run_task.ps1 loads them from .env before launch.

HOST_AGENT:
  VISUAL_MODE: True
  REASONING_MODEL: False
  API_TYPE: "openai"
  API_BASE: "${LOCAL_MODEL_BASE}"
  API_KEY: "local"  # placeholder; local servers don't check it, but the field must be non-empty
  API_VERSION: "2025-02-01-preview"
  API_MODEL: "${LOCAL_MODEL_NAME}"

  PROMPT: "ufo/prompts/share/base/host_agent.yaml"
  EXAMPLE_PROMPT: "ufo/prompts/examples/{mode}/host_agent_example.yaml"

APP_AGENT:
  VISUAL_MODE: True
  REASONING_MODEL: False
  API_TYPE: "openai"
  API_BASE: "${LOCAL_MODEL_BASE}"
  API_KEY: "local"
  API_VERSION: "2025-02-01-preview"
  API_MODEL: "${LOCAL_MODEL_NAME}"

  PROMPT: "ufo/prompts/share/base/app_agent.yaml"
  EXAMPLE_PROMPT: "ufo/prompts/examples/{mode}/app_agent_example.yaml"
  EXAMPLE_PROMPT_AS: "ufo/prompts/examples/{mode}/app_agent_example_as.yaml"

BACKUP_AGENT:
  VISUAL_MODE: True
  API_TYPE: "openai"
  API_BASE: "${LOCAL_MODEL_BASE}"
  API_KEY: "local"
  API_VERSION: "2025-02-01-preview"
  API_MODEL: "${LOCAL_MODEL_NAME}"

EVALUATION_AGENT:
  VISUAL_MODE: True
  REASONING_MODEL: False
  API_TYPE: "openai"
  API_BASE: "${LOCAL_MODEL_BASE}"
  API_KEY: "local"
  API_VERSION: "2025-02-01-preview"
  API_MODEL: "${LOCAL_MODEL_NAME}"

# Omniparser Configuration (unused placeholder, kept for schema fidelity with the template)
OMNIPARSER:
  ENDPOINT: "http://xxx.xxx.xxx.xxx:xxxx"
  BOX_THRESHOLD: 0.05
  IOU_THRESHOLD: 0.1
  USE_PADDLEOCR: True
  IMGSZ: 640

# GPT Parameters
MAX_TOKENS: 2000
MAX_RETRY: 3
TEMPERATURE: 0.0
TOP_P: 0.0
TIMEOUT: 60

# App API Prompt Configuration
APP_API_PROMPT_ADDRESS:
  "WINWORD.EXE": "ufo/prompts/apps/word/api.yaml"
  "EXCEL.EXE": "ufo/prompts/apps/excel/api.yaml"
  "msedge.exe": "ufo/prompts/apps/web/api.yaml"
  "chrome.exe": "ufo/prompts/apps/web/api.yaml"
