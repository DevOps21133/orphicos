# OrphicOS client configuration. Copy to config.toml.
# The client knows ONLY this: where the OrphicOS brain lives and how to
# authenticate to it. No model names, no provider keys — ever.

# OrphicOS brain endpoint (local dev: http://localhost:8100)
BRAIN_BASE = "http://localhost:8100"

# Client token issued by OrphicOS (leave empty for local dev)
CLIENT_TOKEN = ""
