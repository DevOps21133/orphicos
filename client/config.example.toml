# OrphicOS client configuration (example).
# Copy to client/config.toml and set SERVER_BASE.
#
# The client is a THIN app: it has NO brain and NO LLM API key — ever
# (Rules 1 & 6). The only address it talks to is the OrphicOS brain below.

SERVER_BASE = "https://brain.orphicos.ai"

# The per-user OrphicOS token is issued at sign-in (Phase 6) and injected at
# runtime via the ORPHIC_TOKEN environment variable. It is NOT stored in this
# example file, and it is NOT an LLM key.
#
# For local development, point SERVER_BASE at your locally running brain:
#   SERVER_BASE = "http://localhost:8000"

# Optional client tuning (defaults shown):
# REQUEST_TIMEOUT = 30.0   # seconds to wait for each brain decision
# MAX_STEPS = 12           # max perceive->decide->act cycles per command
